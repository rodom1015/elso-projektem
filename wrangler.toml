# A Cloudflare beállításai
name = "roman"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# A weboldal fájljai (HTML, CSS, JS)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# A tárhely, ahová a titkosított fájlok kerülnek.
# A "fajltarolo-fajlok" KV tárhely azonosítója a Cloudflare-en
[[kv_namespaces]]
binding = "FILES"
id = "a0de692d02fd419f827a899563ebe34d"

# AI asszisztens: a Cloudflare Workers AI (ingyenes napi kerettel)
[ai]
binding = "AI"

# Adatbázis a statisztikához és a belépési naplóhoz (D1) – a táblák maguktól létrejönnek
[[d1_databases]]
binding = "DB"
database_name = "rodom-db"
database_id = "a75f8011-52a2-4603-9b4a-17f0eb6a7254"
