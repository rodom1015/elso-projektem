<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Fájltárolóm</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23107c41'/><path d='M10 9l12 14M22 9L10 23' stroke='white' stroke-width='3.5' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hatter-folt folt-1"></div>
  <div class="hatter-folt folt-2"></div>

  <!-- ============ BELÉPÉS ============ -->
  <main id="belepes" class="kepernyo">
    <form id="belepes-urlap" class="kartya belepes-kartya" autocomplete="off">
      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="4" y="11" width="16" height="10" rx="3" fill="currentColor"/></svg>
      </div>
      <h1>Fájltárolóm</h1>
      <p class="alcim">Otthon feltöltöm, munkában letöltöm.</p>

      <label class="mezo">
        <span>Jelszó</span>
        <div class="jelszo-sor">
          <input type="password" id="jelszo" required autofocus placeholder="Add meg a jelszavad">
          <button type="button" id="mutat" class="ikon-gomb" aria-label="Jelszó mutatása">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
          </button>
        </div>
      </label>

      <button type="submit" class="gomb fo" id="belepes-gomb">
        <span class="gomb-szoveg">Belépés</span>
        <span class="porgo" hidden></span>
      </button>
      <p class="hiba" id="belepes-hiba" role="alert"></p>

      <p class="biztonsag">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5l8-3z" fill="currentColor"/></svg>
        A fájlok a böngésződben titkosítódnak – a jelszó nélkül senki nem tudja megnyitni őket.
      </p>
    </form>
  </main>

  <!-- ============ FŐ OLDAL ============ -->
  <main id="tarolo" class="kepernyo" hidden>
    <header class="fejlec">
      <div class="fejlec-cim">
        <div class="logo kicsi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="currentColor"/></svg>
        </div>
        <div>
          <h1>Fájltárolóm</h1>
          <p class="alcim" id="osszesito">Betöltés…</p>
        </div>
      </div>
      <button class="gomb masodlagos" id="kilepes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M15 17l5-5-5-5M20 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Kilépés
      </button>
    </header>

    <label id="ejto-zona" class="ejto-zona" tabindex="0">
      <input type="file" id="fajl-valaszto" multiple accept=".xlsx,.xlsm,.xls,.csv,.ods">
      <div class="ejto-ikon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <strong>Húzd ide az Excel fájlokat</strong>
      <span>vagy kattints a tallózáshoz · max. 20 MB / fájl</span>
    </label>

    <div id="feltoltesek"></div>

    <section class="kartya lista-kartya">
      <div class="lista-fejlec">
        <h2>Fájljaim</h2>
        <div class="kereso">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="kereses" placeholder="Keresés…">
        </div>
      </div>
      <ul id="fajl-lista" class="fajl-lista"></ul>
      <div id="ures" class="ures" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <p>Még nincs feltöltött fájl.</p>
      </div>
    </section>

    <p class="labjegyzet">Biztonsági okból 15 perc tétlenség után automatikusan kilépsz.</p>
  </main>

  <div id="ertesitesek" class="ertesitesek" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
