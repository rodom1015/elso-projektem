  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0c3b24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rodom">
  <link rel="apple-touch-icon" href="/ikonok/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // Téma és szín beállítása még a megjelenés előtt (hogy ne villanjon)
    try {
      var mod = localStorage.getItem("tema") || "auto";
      var sotet = mod === "sotet" || (mod === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.tema = sotet ? "sotet" : "vilagos";
      document.documentElement.dataset.szin = localStorage.getItem("szin") || "zold";
    } catch (e) {}
  </script>
</head>
<body>
<div class="app">

  <!-- ==================== OLDALSÓ MENÜ ==================== -->
  <aside class="oldalsav">
    <a href="#/kezdolap" class="marka">
      <div class="marka-logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6l10 12M17 6L7 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </div>
      <div>
        <strong>Rodom</strong>
        <span data-i18n="brand_sub">Excel központ</span>
      </div>
    </a>

    <nav class="menu" aria-label="Menu">
      <a href="#/kezdolap" data-oldal="kezdolap" class="menu-pont">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v8a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2v-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span data-i18n="nav_home">Kezdőlap</span>
      </a>
      <a href="#/fajlok" data-oldal="fajlok" class="menu-pont">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span data-i18n="nav_files">Fájljaim</span>
        <em class="menu-szam" id="menu-szam" hidden></em>
      </a>
      <a href="#/eszkozok" data-oldal="eszkozok" class="menu-pont">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4 2.6-2.6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span data-i18n="nav_tools">Eszközök</span>
      </a>
      <a href="#/szamolas" data-oldal="szamolas" class="menu-pont">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-i18n="nav_calc">Számolás</span>
      </a>
      <a href="#/fuggvenyek" data-oldal="fuggvenyek" class="menu-pont">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h-2a3 3 0 0 0-3 3v13M6 11h7M15 13l5 6M20 13l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-i18n="nav_functions">Függvények</span>
      </a>
      <a href="#/billentyuk" data-oldal="billentyuk" class="menu-pont">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-i18n="nav_shortcuts">Billentyűk</span>
      </a>
      <a href="#/makrok" data-oldal="makrok" class="menu-pont">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span data-i18n="nav_macros">Makrók</span>
      </a>
      <a href="#/word" data-oldal="word" class="menu-pont">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6z M14 3v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 12.5l1.3 5 1.7-4 1.7 4 1.3-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="nav_word">Word</span>
      </a>
    </nav>

    <div class="oldalsav-alja">
      <div class="nyelvvalto" role="group" data-i18n-title="language"></div>
      <div class="allapot" id="allapot">
        <span class="allapot-pont"></span>
        <span id="allapot-szoveg" data-i18n="status_locked">Zárolva</span>
      </div>
      <button class="kilepes-gomb" id="kilepes" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M15 17l5-5-5-5M20 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="logout">Kilépés</span>
      </button>
    </div>
  </aside>

  <!-- ==================== TARTALOM ==================== -->
  <main class="tartalom">
    <!-- Telefonon ez a fejléc látszik a menü helyett -->
    <div class="mobil-fej">
      <a href="#/kezdolap" class="marka">
        <div class="marka-logo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6l10 12M17 6L7 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </div>
        <div><strong>Rodom</strong><span data-i18n="brand_sub">Excel központ</span></div>
      </a>
      <div class="mobil-jobb">
        <div class="nyelvvalto kompakt" role="group" data-i18n-title="language"></div>
        <button class="kilepes-gomb" id="kilepes-mobil" hidden data-i18n="logout">Kilépés</button>
      </div>
    </div>

    <!-- Felső sáv: oldal neve, dátum, hét, élő óra -->
    <header class="felso-sav">
      <div class="morzsa">
        <span>Rodom</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <strong id="morzsa-oldal"></strong>
      </div>
      <div class="sav-chipek">
        <button type="button" class="chip gomb-chip telepito-chip" id="telepites" hidden data-i18n="pwa_install"></button>
        <button type="button" class="chip gomb-chip kereso-chip" id="paletta-nyit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span data-i18n="cp_open"></span><kbd>Ctrl K</kbd>
        </button>
        <a href="#/kezdolap" class="chip" id="sav-idojaras" hidden></a>
        <span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="sav-datum"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="sav-het"></span></span>
        <span class="chip ora-chip"><span class="elo-pont"></span><span id="sav-ora" class="tabular"></span></span>
        <div class="tema-doboz">
          <button type="button" class="chip gomb-chip" id="tema-gomb" data-i18n-title="th_title">🎨</button>
          <div class="tema-panel kartya" id="tema-panel" hidden>
            <strong data-i18n="th_mode"></strong>
            <div class="kapcsolo harom" id="tema-mod">
              <button type="button" data-mod="auto" data-i18n="th_auto"></button>
              <button type="button" data-mod="vilagos" data-i18n="th_light"></button>
              <button type="button" data-mod="sotet" data-i18n="th_dark"></button>
            </div>
            <strong data-i18n="th_color"></strong>
            <div class="szin-valaszto" id="tema-szin">
              <button type="button" data-szin="zold" style="--minta:#107c41" aria-label="zöld"></button>
              <button type="button" data-szin="kek" style="--minta:#2563eb" aria-label="kék"></button>
              <button type="button" data-szin="lila" style="--minta:#7c3aed" aria-label="lila"></button>
              <button type="button" data-szin="narancs" style="--minta:#ea580c" aria-label="narancs"></button>
              <button type="button" data-szin="grafit" style="--minta:#334155" aria-label="grafit"></button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- ========== KEZDŐLAP ========== -->
    <section class="oldal" id="oldal-kezdolap" hidden>
      <div class="hos">
        <div>
          <p class="hos-datum" id="mai-datum"></p>
          <h1 id="koszontes">👋</h1>
          <p class="hos-alcim" data-i18n="hero_sub"></p>
        </div>
        <div class="hos-jobb">
          <div class="nagy-ora tabular"><span id="hos-ora">00:00</span><small id="hos-mp">00</small></div>
          <a href="#/fajlok" class="gomb fo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span data-i18n="upload"></span>
          </a>
        </div>
      </div>

      <div class="statok" id="statok">
        <div class="stat kartya">
          <div class="stat-ikon zold"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6z M14 3v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div>
          <div><span class="stat-cimke" data-i18n="stat_files"></span><strong class="stat-ertek" id="stat-db">–</strong></div>
        </div>
        <div class="stat kartya">
          <div class="stat-ikon kek"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
          <div><span class="stat-cimke" data-i18n="stat_size"></span><strong class="stat-ertek" id="stat-meret">–</strong></div>
        </div>
        <div class="stat kartya">
          <div class="stat-ikon narancs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <div><span class="stat-cimke" data-i18n="stat_last"></span><strong class="stat-ertek" id="stat-utolso">–</strong></div>
        </div>
        <div class="stat kartya">
          <div class="stat-ikon lila"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <div class="stat-tarhely">
            <span class="stat-cimke" data-i18n="stat_storage"></span>
            <strong class="stat-ertek" id="stat-tarhely">–</strong>
            <div class="savsor kicsi"><div id="stat-sav"></div></div>
          </div>
        </div>
        <a href="#/fajlok" class="statok-zar" id="statok-zar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="4" y="11" width="16" height="10" rx="3" fill="currentColor"/></svg>
          <span data-i18n="stats_locked"></span>
        </a>
      </div>

      <div class="racs-2 naptar-sor">
        <div class="kartya naptar-kartya">
          <div class="kartya-fej">
            <h2 data-i18n="cal_title"></h2>
            <div class="naptar-vezerlok">
              <div class="kapcsolo mini" id="naptar-orszag">
                <button type="button" data-orszag="hu">HU</button>
                <button type="button" data-orszag="sk">SK</button>
              </div>
              <button class="kis-gomb" id="naptar-elozo" data-i18n-title="cal_prev"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
              <button class="kis-gomb" id="naptar-kovetkezo" data-i18n-title="cal_next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
            </div>
          </div>
          <button class="naptar-honap" id="naptar-honap" data-i18n-title="cal_today"></button>
          <div class="naptar" id="naptar"></div>
          <div class="naptar-unnepek">
            <strong data-i18n="cal_holidays"></strong>
            <ul id="naptar-lista"></ul>
            <p class="kalk-megj" data-i18n="cal_note"></p>
          </div>
        </div>

        <div class="jobb-oszlop">
        <div class="kartya idojaras-kartya" id="idojaras-kartya">
          <div class="kartya-fej">
            <h2 data-i18n="wx_title"></h2>
            <button type="button" class="link-gomb" id="wx-valt" data-i18n="wx_change"></button>
          </div>
          <div class="wx-kereso" id="wx-kereso" hidden>
            <input type="search" id="wx-varos" data-i18n-ph="wx_search_ph" autocomplete="off">
            <button type="button" class="gomb masodlagos kicsi" id="wx-hely" data-i18n="wx_my_location"></button>
            <ul class="wx-talalatok" id="wx-talalatok"></ul>
          </div>
          <div id="wx-tartalom"><p class="halvany-szoveg" data-i18n="fx_loading"></p></div>
        </div>
        <div class="kartya arfolyam-kartya">
          <div class="kartya-fej"><h2 data-i18n="fx_title"></h2><span class="halvany-szoveg kicsi-szoveg" id="fx-forras"></span></div>
          <div id="fx-tartalom"><p class="halvany-szoveg" data-i18n="fx_loading"></p></div>
        </div>
        </div>
      </div>

      <div class="racs-2">
        <div class="kartya tipp-kartya">
          <div class="kartya-fej">
            <h2 data-i18n="tip_title"></h2>
            <button class="kis-gomb" id="uj-tipp" data-i18n-title="tip_next">
              <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div id="tipp"></div>
        </div>

        <div class="kartya">
          <div class="kartya-fej">
            <h2 data-i18n="recent_title"></h2>
            <a href="#/fajlok" class="link" data-i18n="all_link"></a>
          </div>
          <ul class="fajl-lista" id="legutobbi"></ul>
          <p class="halvany-szoveg" id="legutobbi-ures"></p>
        </div>
      </div>

      <div class="gyors">
        <a href="#/fajlok" class="gyors-kartya">
          <span class="gyors-ikon zold">📁</span>
          <strong data-i18n="nav_files"></strong>
          <span data-i18n="quick_files_sub"></span>
        </a>
        <a href="#/eszkozok" class="gyors-kartya">
          <span class="gyors-ikon lila">🧰</span>
          <strong data-i18n="tools_title"></strong>
          <span data-i18n="quick_tools_sub"></span>
        </a>
        <a href="#/szamolas" class="gyors-kartya">
          <span class="gyors-ikon zold">🧮</span>
          <strong data-i18n="calc_title"></strong>
          <span data-i18n="quick_calc_sub"></span>
        </a>
        <a href="#/fuggvenyek" class="gyors-kartya">
          <span class="gyors-ikon kek">ƒx</span>
          <strong data-i18n="quick_fn_title"></strong>
          <span id="gyors-fv-sub"></span>
        </a>
        <a href="#/billentyuk" class="gyors-kartya">
          <span class="gyors-ikon lila">⌨️</span>
          <strong data-i18n="quick_sc_title"></strong>
          <span id="gyors-sc-sub"></span>
        </a>
        <a href="#/word" class="gyors-kartya">
          <span class="gyors-ikon kek">W</span>
          <strong data-i18n="word_title"></strong>
          <span data-i18n="quick_word_sub"></span>
        </a>
        <a href="#/makrok" class="gyors-kartya">
          <span class="gyors-ikon narancs">⚙️</span>
          <strong data-i18n="nav_macros"></strong>
          <span id="gyors-mac-sub"></span>
        </a>
      </div>
    </section>

    <!-- ========== FÁJLJAIM ========== -->
    <section class="oldal" id="oldal-fajlok" hidden>
      <header class="oldal-fej">
        <div>
          <h1 data-i18n="files_title"></h1>
          <p class="hos-alcim" id="osszesito"></p>
        </div>
      </header>

      <!-- Belépés -->
      <form id="belepes-urlap" class="kartya belepes-kartya" autocomplete="off">
        <div class="belepes-logo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="4" y="11" width="16" height="10" rx="3" fill="currentColor"/></svg>
        </div>
        <h2 data-i18n="login_title"></h2>
        <p class="hos-alcim" data-i18n="login_sub"></p>
        <label class="mezo">
          <span data-i18n="password"></span>
          <div class="jelszo-sor">
            <input type="password" id="jelszo" required data-i18n-ph="password_ph">
            <button type="button" id="mutat" class="szem-gomb" data-i18n-title="show_password">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
            </button>
          </div>
        </label>
        <button type="submit" class="gomb fo teljes" id="belepes-gomb">
          <span class="gomb-szoveg" data-i18n="login"></span>
          <span class="porgo" hidden></span>
        </button>
        <p class="hiba" id="belepes-hiba" role="alert"></p>
        <div class="vagy-elvalaszto"><span data-i18n="qr_or"></span></div>
        <button type="button" class="gomb masodlagos teljes" id="qr-inditas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z" fill="currentColor"/></svg>
          <span data-i18n="qr_login"></span>
        </button>
